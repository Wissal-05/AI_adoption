[project]
name = "ai-adoption-analytics"
version = "0.1.0"
description = "Modular analytics platform for digital service adoption and security analytics."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "streamlit>=1.36",
  "plotly>=5.22",
  "python-dotenv>=1.0",
  "langchain>=0.2",
  "langchain-openai>=0.1",
  "psycopg[binary]>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
